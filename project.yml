name: ThubanDesk
options:
  bundleIdPrefix: com.thuban
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ThubanDeskCore:
    path: Packages/ThubanDeskCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ThubanDesk:
    type: application
    platform: macOS
    sources:
      - path: ThubanDesk/App
      - path: ThubanDesk/Views
      - path: ThubanDesk/Web
      - path: ThubanDesk/Resources/Assets.xcassets
    dependencies:
      - package: ThubanDeskCore
        product: ThubanDeskCore
    info:
      path: ThubanDesk/Resources/Info.plist
      properties:
        CFBundleName: Thuban Desk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Thuban Desk
        CFBundleIdentifier: com.thuban.desk
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Chancellor Verdery"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: ThubanDesk/Resources/ThubanDesk.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thuban.desk
        PRODUCT_NAME: Thuban Desk
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: false
